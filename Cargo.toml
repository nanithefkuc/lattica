[package]
name = "lattica"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Shared arithmetic for point lattices, underneath lattice-based erasure codes"
repository = "https://github.com/nanithefkuc/lattica"
keywords = ["lattice", "quantization", "erasure-coding", "coding-theory"]
categories = ["algorithms", "mathematics"]

[features]
default = ["simd"]
# Runtime-dispatched real-vector kernels. Selection is stack-wide through
# simdispatch; archmage supplies safe capability tokens and memory operations.
simd = ["dep:archmage", "dep:simdispatch"]
# Unstable implementation APIs, exempt from compatibility guarantees.
internals = []

[dependencies]
archmage = { git = "https://github.com/nanithefkuc/archmage", rev = "de519319b5670d93f71dada4c49cdfd83c0fc0ec", optional = true }
simdispatch = { git = "https://github.com/nanithefkuc/simdispatch", rev = "5940194107384953cd8cd9f45c8d902b26d5686e", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "kernel"
harness = false
required-features = ["internals"]

[lints.rust]
missing_docs = "deny"
# `forbid` lives in src/lib.rs so that integration tests may install a
# counting global allocator, which requires `unsafe impl GlobalAlloc`.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
as_conversions = "warn"
cast_possible_truncation = "warn"
float_cmp = "warn"
