[package]
name = "lattica"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Shared arithmetic for point lattices, underneath lattice-based erasure codes"
repository = "https://github.com/nanithefkuc/lattica"
keywords = ["lattice", "erasure-coding", "coding-theory"]
categories = ["algorithms", "mathematics"]
# The competitor harnesses under `external/` are repository-only tooling, not
# crate targets: each is its own unpublished package, and this exclusion keeps
# every one of them out of `cargo package`.
exclude = ["external/"]

[features]
default = ["simd"]
# Runtime-dispatched real-vector kernels. Selection is stack-wide through
# simdispatch; archmage supplies safe capability tokens and memory operations.
simd = ["dep:archmage", "dep:simdispatch"]
# Unstable implementation APIs, exempt from compatibility guarantees.
internals = []

[dependencies]
archmage = { version = "=0.9.29", optional = true }
simdispatch = { version = "=0.1.0", optional = true }

[dev-dependencies]
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "kernel"
harness = false
required-features = ["internals"]

[[bench]]
name = "optimization"
harness = false
required-features = ["internals"]

[[test]]
name = "zero_alloc_internals"
required-features = ["internals"]

[lints.rust]
missing_docs = "deny"
# `forbid` lives in src/lib.rs so that integration tests may install a
# counting global allocator, which requires `unsafe impl GlobalAlloc`.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
as_conversions = "warn"
cast_possible_truncation = "warn"
float_cmp = "warn"

# Release codegen a profiler can attribute: opt-level 3 with full debug info
# and no symbol stripping. Frame pointers come from RUSTFLAGS in `just
# profile-perf`, since they are not a Cargo profile key.
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"
