name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.features }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        features: ["", "--all-features", "--no-default-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test ${{ matrix.features }}

  msrv:
    name: msrv 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - run: cargo build --all-features

  lint:
    name: fmt, clippy, doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: rustdoc
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # Ground rule: merge every dispatchable host tier and fail below 95% line
  # coverage over the crate's own source.
  coverage:
    name: coverage >=95% (llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0
      - run: cargo llvm-cov --no-report --all-features
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: v3
      - run: cargo llvm-cov --no-report --all-features
        env:
          SIMD_BACKEND: scalar
      - run: cargo llvm-cov report --summary-only
      - run: cargo llvm-cov report --fail-under-lines 95 --lcov --output-path coverage.lcov
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage.lcov

  deps:
    name: dependency boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Charter I4: lattica is a leaf. It must never acquire `fff` (field
      # arithmetic) or `sgraph` (layer 2) as a dependency. A convention that is
      # only written down does not survive contact with a deadline.
      - name: assert dependency set
        run: |
          tree=$(cargo tree --all-features --prefix none --no-dedupe \
                   | awk 'NF {print $1}' | sort -u | grep -v '^lattica$' || true)
          echo "dependencies: ${tree:-<none>}"
          for forbidden in fff fgf sgraph cafft gfm; do
            if echo "$tree" | grep -qx "$forbidden"; then
              echo "::error::forbidden dependency: $forbidden"
              exit 1
            fi
          done

  cross-execute:
    name: cross-execute ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-unknown-linux-gnu, i686-unknown-linux-gnu, wasm32-wasip1]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Exact integer arithmetic must behave identically on every
      # architecture. A build-only job proves nothing about that, so the
      # acceptance tests are *executed* under emulation on every target, not
      # merely compiled for them.
      - uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}
      - run: cargo test --target ${{ matrix.target }} --no-default-features

  cross-build:
    name: cross-build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [wasm32-unknown-unknown, aarch64-apple-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --target ${{ matrix.target }} --no-default-features

  miri:
    name: miri (focused scalar safety)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: exact integer arithmetic
        run: "cargo miri test --lib --no-default-features int::"
